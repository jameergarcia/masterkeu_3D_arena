<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon.js Debug Mode</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #statusOverlay {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 400px;
      line-height: 1.4;
      pointer-events: none;
    }
    .error-msg {
      color: #ff5252;
      font-weight: bold;
    }
    .success-msg {
      color: #4caf50;
    }
  </style>

  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <div id="statusOverlay">Status: Naglo-load...</div>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const statusDiv = document.getElementById("statusOverlay");
    const engine = new BABYLON.Engine(canvas, true);

    function updateStatus(text, isError = false) {
      if (isError) {
        statusDiv.innerHTML = `<span class="error-msg">⚠️ ERROR:</span><br/>${text}<br/><br/><i>Buksan ang F12 Console para sa kumpletong detalye.</i>`;
      } else {
        statusDiv.innerHTML = `<span class="success-msg">●</span> ${text}`;
      }
    }

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      // Kulay ng langit para siguradong hindi black screen
      scene.clearColor = new BABYLON.Color4(0.4, 0.6, 0.9, 1.0);

      // Default Camera bago mag-load ang hero
      const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 15, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);

      // Ilaw
      const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
      hemiLight.intensity = 0.9;

      const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight.intensity = 0.5;

      // Mag-load ng models gamit ang try-catch
      (async () => {
        try {
          updateStatus("Hinahanap ang models/map.glb...");
          const mapResult = await BABYLON.SceneLoader.ImportMeshAsync("", "./models/", "map.glb", scene);
          updateStatus("Na-load ang map.glb! Hinahanap ang models/base.glb...");

          const heroResult = await BABYLON.SceneLoader.ImportMeshAsync("", "./models/", "base.glb", scene);
          const hero = heroResult.meshes[0];
          updateStatus("Handa na! Gamitin ang WASD para gumalaw.");

          // Ikabit ang camera sa Hero
          camera.lockedTarget = hero;

          // Keyboard Movement
          const inputMap = {};
          scene.actionManager = new BABYLON.ActionManager(scene);
          scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (evt) => {
            inputMap[evt.sourceEvent.key.toLowerCase()] = true;
          }));
          scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (evt) => {
            inputMap[evt.sourceEvent.key.toLowerCase()] = false;
          }));

          const moveSpeed = 0.15;
          scene.onBeforeRenderObservable.add(() => {
            let isMoving = false;
            let moveVector = new BABYLON.Vector3(0, 0, 0);

            if (inputMap["w"] || inputMap["arrowup"]) { moveVector.z += moveSpeed; isMoving = true; }
            if (inputMap["s"] || inputMap["arrowdown"]) { moveVector.z -= moveSpeed; isMoving = true; }
            if (inputMap["a"] || inputMap["arrowleft"]) { moveVector.x -= moveSpeed; isMoving = true; }
            if (inputMap["d"] || inputMap["arrowright"]) { moveVector.x += moveSpeed; isMoving = true; }

            if (isMoving) {
              hero.position.addInPlace(moveVector);
              hero.rotation.y = Math.atan2(moveVector.x, moveVector.z);
            }
          });

        } catch (err) {
          console.error("Error loading models:", err);
          updateStatus(err.message, true);
        }
      })();

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
