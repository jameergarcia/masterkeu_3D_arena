<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MASTERKEU — Three.js Hero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:14px;top:14px;padding:12px 15px;border:1px solid #ffffff25;background:#07101dcc;border-radius:14px;backdrop-filter:blur(8px)}.title{font-weight:900;letter-spacing:2px;font-size:18px}.sub{font-size:11px;color:#aab7d5;margin-top:3px}.status{font-size:12px;color:#9fffc5;margin-top:7px;max-width:70vw}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;max-width:96vw;flex-wrap:wrap;justify-content:center}.btn{border:1px solid #ffffff35;color:white;background:#121d34eF;border-radius:12px;padding:12px 14px;font-weight:800;font-size:12px;box-shadow:0 5px 20px #0005;touch-action:manipulation}.btn:active{transform:scale(.96)}.wind{border-color:#60d8ff88}.earth{border-color:#bda06b88}.fire{border-color:#ff754b99}.hint{position:absolute;right:14px;top:14px;text-align:right;font-size:11px;line-height:1.7;color:#c5cce0;background:#07101dcc;border:1px solid #ffffff20;border-radius:12px;padding:10px 12px}.mobilepad{position:absolute;left:14px;bottom:100px;display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px;gap:5px;pointer-events:auto}.pad{border:1px solid #ffffff30;background:#152039dd;color:white;border-radius:10px;font-size:17px;font-weight:900;touch-action:none}.pad[data-k="w"]{grid-column:2}.pad[data-k="a"]{grid-column:1;grid-row:2}.pad[data-k="s"]{grid-column:2;grid-row:2}.pad[data-k="d"]{grid-column:3;grid-row:2}@media(min-width:800px){.mobilepad{display:none}}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#090d18;z-index:5;text-align:center;padding:24px}#loading.hide{display:none}.loaderbox{max-width:380px}.spinner{width:38px;height:38px;border:3px solid #ffffff25;border-top-color:#6ce7ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="loading"><div class="loaderbox"><div class="spinner"></div><b>MASTERKEU IS LOADING…</b><p style="color:#aab7d5;font-size:13px">Place <b>base.fbx</b> beside this index.html file. The FBX is loaded directly in your browser.</p></div></div>
<div id="hud"><div class="top"><div class="title">MASTERKEU <span style="color:#ff784f">✦</span></div><div class="sub">THREE.JS HERO PROTOTYPE</div><div class="status" id="status">Preparing 3D scene…</div></div><div class="hint">MOVE: WASD / touch pad<br>ATTACK: SPACE<br>SKILLS: buttons below</div><div class="mobilepad"><button class="pad" data-k="w">▲</button><button class="pad" data-k="a">◀</button><button class="pad" data-k="s">▼</button><button class="pad" data-k="d">▶</button></div><div class="controls"><button class="btn" id="attack">⚔️ SWORD ATTACK</button><button class="btn wind" id="wind">🌪️ WHIRLWIND</button><button class="btn earth" id="earth">🪨 EARTH BREAK</button><button class="btn fire" id="fire">🔥 FLAME AOE</button></div></div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const statusEl=document.querySelector('#status'), loading=document.querySelector('#loading');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x090d18); scene.fog=new THREE.Fog(0x090d18,18,48);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200); camera.position.set(0,4.3,9.5);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa9c9ff,0x24172d,2.0)); const key=new THREE.DirectionalLight(0xffe0bd,3.2); key.position.set(4,9,5); key.castShadow=true; scene.add(key); const rim=new THREE.PointLight(0x32aaff,25,18); rim.position.set(-4,3,-3); scene.add(rim); const fireLight=new THREE.PointLight(0xff4d20,0,9); fireLight.position.set(0,2,0); scene.add(fireLight);
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x111a2c,roughness:.9,metalness:.15})); floor.rotation.x=-Math.PI/2; floor.position.y=-.04; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(60,60,0x29405f,0x1a2a42); grid.position.y=-.025; scene.add(grid);
const platform=new THREE.Mesh(new THREE.CylinderGeometry(2.15,2.3,.16,64),new THREE.MeshStandardMaterial({color:0x1b2941,metalness:.55,roughness:.45,emissive:0x071b2e})); platform.position.y=.02; platform.receiveShadow=true; platform.castShadow=true; scene.add(platform);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.05,.025,8,96),new THREE.MeshBasicMaterial({color:0x38cfff})); ring.rotation.x=Math.PI/2; ring.position.y=.12; scene.add(ring);
const heroRoot=new THREE.Group(); scene.add(heroRoot); let hero=null,mixer=null,clips=[],activeAction=null, modelHeight=3, attackUntil=0, skillCooldown=0; const clock=new THREE.Clock(); const keys={}; const effects=[];
function setStatus(t){statusEl.textContent=t}
function playClip(match){if(!mixer||!clips.length)return false; const clip=clips.find(c=>match.test(c.name.toLowerCase())); if(!clip)return false; const action=mixer.clipAction(clip); if(activeAction===action && action.isRunning())return true; if(activeAction&&activeAction!==action)activeAction.fadeOut(.12); action.reset().fadeIn(.12).play(); activeAction=action; return true;}
function loadHero(){const loader=new FBXLoader(); loader.load('./base.fbx',obj=>{hero=obj; const box=new THREE.Box3().setFromObject(hero); const size=box.getSize(new THREE.Vector3()); const height=Math.max(size.y,.01); const scale=3.0/height; hero.scale.setScalar(scale); const scaledBox=new THREE.Box3().setFromObject(hero); hero.position.y-=scaledBox.min.y; hero.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material]; for(const m of mats){if(m.map)m.map.colorSpace=THREE.SRGBColorSpace; m.needsUpdate=true;}}}}); heroRoot.add(hero); modelHeight=3; clips=obj.animations||[]; if(clips.length){mixer=new THREE.AnimationMixer(hero); const idle=clips.find(c=>/idle|stand|breath/i.test(c.name))||clips[0]; activeAction=mixer.clipAction(idle); activeAction.play(); setStatus(`FBX loaded • ${clips.length} animation clip(s): ${clips.map(c=>c.name).slice(0,3).join(', ')}`);}else{setStatus('FBX loaded • no embedded animation clips; procedural movement enabled');} loading.classList.add('hide');},undefined,err=>{console.error(err);setStatus('Could not load base.fbx. Check that it is in the same folder as index.html.');loading.querySelector('b').textContent='COULD NOT LOAD base.fbx';loading.querySelector('p').innerHTML='Upload <b>base.fbx</b> to the same folder as <b>index.html</b>, then run through a local web server. Opening the HTML as a file may block model loading.';});}
// Basic sword prop for when the FBX has no visible weapon. It is kept subtle and attached near the character's right side.
function makeSword(){const sword=new THREE.Group(); const blade=new THREE.Mesh(new THREE.BoxGeometry(.075,.95,.045),new THREE.MeshStandardMaterial({color:0xdcecff,metalness:.85,roughness:.2,emissive:0x18304b})); blade.position.y=.63; const guard=new THREE.Mesh(new THREE.BoxGeometry(.32,.07,.09),new THREE.MeshStandardMaterial({color:0xffa34a,metalness:.7,roughness:.25,emissive:0x5a2100})); guard.position.y=.15; const grip=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.3,8),new THREE.MeshStandardMaterial({color:0x493027})); grip.position.y=-.02; sword.add(blade,guard,grip); sword.position.set(.48,1.0,.1); sword.rotation.z=-.35; heroRoot.add(sword); return sword;} let swordProp=null;
function burst(type){const now=performance.now(); if(now<skillCooldown)return; skillCooldown=now+550; const colors={wind:0x50dfff,earth:0xc59b61,fire:0xff4a20,attack:0xffffff}; const color=colors[type]||0xffffff; const group=new THREE.Group(); group.position.set(heroRoot.position.x,.12,heroRoot.position.z); scene.add(group); const duration=type==='attack'?.42:1.15;
if(type==='wind'){for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.TorusGeometry(1.0+i*.35,.045,8,64),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));m.rotation.x=Math.PI/2;m.position.y=.4+i*.55;group.add(m);} for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.045,.045,.45),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));const a=i*Math.PI*2/18;m.position.set(Math.cos(a)*1.5,.35+Math.random()*1.5,Math.sin(a)*1.5);m.rotation.y=-a;group.add(m);}}
else if(type==='earth'){const ringMesh=new THREE.Mesh(new THREE.TorusGeometry(.5,.09,8,48),new THREE.MeshStandardMaterial({color,emissive:0x43260b,roughness:.7}));ringMesh.rotation.x=Math.PI/2;ringMesh.position.y=.18;group.add(ringMesh);for(let i=0;i<11;i++){const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.18+Math.random()*.18,0),new THREE.MeshStandardMaterial({color:0x81705b,roughness:1}));const a=i/11*Math.PI*2;rock.position.set(Math.cos(a)*(.8+Math.random()*.9),.2,Math.sin(a)*(.8+Math.random()*.9));rock.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);group.add(rock);}}
else if(type==='fire'){const ringMesh=new THREE.Mesh(new THREE.TorusGeometry(.65,.13,10,64),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));ringMesh.rotation.x=Math.PI/2;ringMesh.position.y=.25;group.add(ringMesh);for(let i=0;i<28;i++){const flame=new THREE.Mesh(new THREE.ConeGeometry(.09+Math.random()*.09,.35+Math.random()*.65,6),new THREE.MeshBasicMaterial({color:i%2?0xffa32c:0xff3a17,transparent:true,opacity:.88}));const a=i/28*Math.PI*2;const r=.7+Math.random()*1.1;flame.position.set(Math.cos(a)*r,.15+Math.random()*.35,Math.sin(a)*r);group.add(flame);}fireLight.intensity=32;}
else {const slash=new THREE.Mesh(new THREE.TorusGeometry(1.05,.07,8,48,Math.PI*1.15),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));slash.position.y=1.35;slash.rotation.set(.2,0,-.7);group.add(slash);}
effects.push({group,start:now,duration,type}); if(type==='attack'){attackUntil=now+420; playClip(/attack|slash|sword|fight|hit/i);} else if(type==='wind'){playClip(/spin|whirl|attack|slash/i)} else if(type==='earth'){playClip(/stomp|attack|slash/i)} else {playClip(/cast|magic|attack/i)} }
function doMove(){let x=0,z=0;if(keys.w||keys.ArrowUp)z-=1;if(keys.s||keys.ArrowDown)z+=1;if(keys.a||keys.ArrowLeft)x-=1;if(keys.d||keys.ArrowRight)x+=1;const moving=x!==0||z!==0;if(moving){const len=Math.hypot(x,z);x/=len;z/=len;heroRoot.position.x+=x*clock.getDelta()*3.2;heroRoot.position.z+=z*clock.getDelta()*3.2;heroRoot.rotation.y=Math.atan2(x,z)+Math.PI;playClip(/walk|run|move/i);}return moving;}
// Use a single delta per frame for stable movement.
let previous=performance.now(); function animate(){requestAnimationFrame(animate);const now=performance.now(),dt=Math.min((now-previous)/1000,.05);previous=now;clock.elapsedTime+=dt;let x=0,z=0;if(keys.w||keys.ArrowUp)z-=1;if(keys.s||keys.ArrowDown)z+=1;if(keys.a||keys.ArrowLeft)x-=1;if(keys.d||keys.ArrowRight)x+=1;const moving=x!==0||z!==0;if(moving){const len=Math.hypot(x,z);x/=len;z/=len;heroRoot.position.x+=x*dt*3.2;heroRoot.position.z+=z*dt*3.2;heroRoot.position.x=THREE.MathUtils.clamp(heroRoot.position.x,-7,7);heroRoot.position.z=THREE.MathUtils.clamp(heroRoot.position.z,-7,7);heroRoot.rotation.y=Math.atan2(x,z)+Math.PI;if(mixer)playClip(/walk|run|move/i);}else if(mixer&&activeAction&&!/idle|stand|breath/i.test(activeAction.getClip().name.toLowerCase())&&now>attackUntil){playClip(/idle|stand|breath/i)}if(hero){if(!mixer)hero.rotation.y=moving?0:Math.sin(now*.001)*.025;if(!mixer&&moving)hero.position.y=Math.abs(Math.sin(now*.012))*.05;}
if(mixer)mixer.update(dt); if(swordProp){swordProp.visible=!hero||!hero.getObjectByName('mixamorigRightHand')&&!hero.getObjectByName('RightHand');}
for(let i=effects.length-1;i>=0;i--){const e=effects[i],t=(now-e.start)/(e.duration*1000);e.group.scale.setScalar(1+t*.85);e.group.traverse(o=>{if(o.material&&'opacity'in o.material)o.material.opacity=Math.max(0,1-t);});if(t>=1){scene.remove(e.group);e.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});effects.splice(i,1);}}
fireLight.intensity=Math.max(0,fireLight.intensity-dt*45);ring.rotation.z=clock.elapsedTime*.2;camera.position.x+=(heroRoot.position.x*.24-camera.position.x)*.04;camera.position.z+=(9.5+heroRoot.position.z*.16-camera.position.z)*.04;camera.lookAt(heroRoot.position.x,1.35,heroRoot.position.z);renderer.render(scene,camera);}
loadHero();
// Add a simple visible sword placeholder; hidden if the loaded FBX includes a likely hand bone.
swordProp=makeSword();
document.querySelector('#attack').addEventListener('click',()=>burst('attack'));document.querySelector('#wind').addEventListener('click',()=>burst('wind'));document.querySelector('#earth').addEventListener('click',()=>burst('earth'));document.querySelector('#fire').addEventListener('click',()=>burst('fire'));
addEventListener('keydown',e=>{keys[e.key]=true; if(e.code==='Space'){e.preventDefault();burst('attack')} });addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.pad').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body></html>
